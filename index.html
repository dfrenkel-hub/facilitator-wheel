<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facilitator Wheel — Finom</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --pink: #FE42B4; --dark: #1a1a1a; --card: #242424; --border: #333; --text: #ffffff; --muted: #888; }

  body { font-family: 'Poppins', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  header { padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .logo { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .logo span { color: var(--pink); }
  .badge { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 40px 100px; gap: 32px; }

  .wheel-wrapper { position: relative; width: 460px; height: 460px; flex-shrink: 0; }
  canvas#wheel { display: block; border-radius: 50%; }
  .pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid var(--pink); filter: drop-shadow(0 2px 8px rgba(254,66,180,0.6)); z-index: 10; }

  .controls { display: flex; gap: 12px; align-items: center; }

  .spin-btn { background: var(--pink); color: white; border: none; padding: 16px 52px; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 500; border-radius: 4px; cursor: pointer; letter-spacing: 0.3px; transition: opacity 0.15s, transform 0.1s; }
  .spin-btn:hover { opacity: 0.9; }
  .spin-btn:active { transform: scale(0.97); }
  .spin-btn:disabled { opacity: 0.4; cursor: default; }

  .edit-btn { background: none; color: var(--muted); border: 1px solid var(--border); padding: 16px 22px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: border-color 0.15s, color 0.15s; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .edit-btn:hover { border-color: var(--pink); color: var(--text); }

  .count-badge { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px; font-size: 11px; color: var(--muted); }

  .history-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .history-row .hname { color: var(--text); }
  .history-row .sep { color: var(--border); }

  /* DRAWER */
  .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; }
  .drawer-overlay.open { display: block; }
  .drawer { position: fixed; top: 0; right: -440px; width: 420px; height: 100vh; background: #1e1e1e; border-left: 1px solid var(--border); z-index: 201; display: flex; flex-direction: column; transition: right 0.28s cubic-bezier(0.4,0,0.2,1); overflow: hidden; }
  .drawer.open { right: 0; }

  .drawer-header { padding: 24px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .drawer-title { font-size: 15px; font-weight: 500; }
  .drawer-close { background: none; border: 1px solid var(--border); color: var(--muted); width: 32px; height: 32px; border-radius: 4px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, color 0.15s; line-height: 1; flex-shrink: 0; }
  .drawer-close:hover { border-color: var(--text); color: var(--text); }

  .drawer-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; text-transform: uppercase; letter-spacing: 0.5px; }
  .tab.active { color: var(--pink); border-bottom-color: var(--pink); }

  .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* LIST TAB */
  .list-actions { padding: 16px 24px 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .member-count { font-size: 12px; color: var(--muted); }
  .add-one-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 4px; font-family: 'Poppins', sans-serif; font-size: 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .add-one-btn:hover { border-color: var(--pink); color: var(--pink); }

  .members-scroll { flex: 1; overflow-y: auto; padding: 0 24px 24px; }
  .members-scroll::-webkit-scrollbar { width: 4px; }
  .members-scroll::-webkit-scrollbar-track { background: transparent; }
  .members-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .members-list { display: flex; flex-direction: column; gap: 6px; }

  .member-row { display: flex; align-items: center; gap: 8px; }
  .member-row input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; color: var(--text); font-family: 'Poppins', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .member-row input:focus { border-color: var(--pink); }
  .member-row input::placeholder { color: var(--muted); }
  .remove-btn { background: none; border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 4px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: border-color 0.15s, color 0.15s; line-height: 1; }
  .remove-btn:hover { border-color: #e24b4a; color: #e24b4a; }

  /* BULK TAB */
  .bulk-area { flex: 1; display: flex; flex-direction: column; padding: 20px 24px 24px; gap: 14px; overflow: hidden; }
  .bulk-hint { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .bulk-hint strong { color: var(--text); font-weight: 500; }
  textarea#bulkInput { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 12px; color: var(--text); font-family: 'Poppins', sans-serif; font-size: 13px; resize: none; outline: none; line-height: 1.7; transition: border-color 0.15s; }
  textarea#bulkInput:focus { border-color: var(--pink); }
  textarea#bulkInput::placeholder { color: var(--muted); }

  .bulk-mode-row { display: flex; gap: 8px; flex-shrink: 0; }
  .mode-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 4px; font-family: 'Poppins', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .mode-btn.active { border-color: var(--pink); color: var(--pink); background: rgba(254,66,180,0.08); }

  .bulk-footer { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .bulk-preview { font-size: 12px; color: var(--muted); flex: 1; }
  .bulk-preview b { color: var(--pink); font-weight: 500; }
  .apply-btn { background: var(--pink); color: white; border: none; padding: 10px 20px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: opacity 0.15s; flex-shrink: 0; }
  .apply-btn:hover { opacity: 0.9; }
  .apply-btn:disabled { opacity: 0.4; cursor: default; }

  /* WINNER */
  .winner-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; align-items: center; justify-content: center; }
  .winner-overlay.active { display: flex; }
  .winner-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 48px 56px; text-align: center; max-width: 380px; width: 90%; }
  .winner-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
  .winner-name { font-size: 36px; font-weight: 600; color: var(--pink); margin-bottom: 8px; line-height: 1.2; }
  .winner-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
  .winner-close { background: var(--pink); color: white; border: none; padding: 14px 40px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: opacity 0.15s; }
  .winner-close:hover { opacity: 0.9; }

  .rig-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 40px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); background: var(--dark); z-index: 50; }
  .rig-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; transition: color 0.15s; }
  .rig-label:hover { color: var(--text); }
  .rig-label.on { color: var(--pink); }
  .rig-note { font-size: 11px; color: var(--border); margin-left: 4px; }

  input#rigCheck { appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); cursor: pointer; position: relative; transition: background 0.2s, border-color 0.2s; flex-shrink: 0; }
  input#rigCheck::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform 0.2s, background 0.2s; }
  input#rigCheck:checked { background: rgba(254,66,180,0.15); border-color: var(--pink); }
  input#rigCheck:checked::after { transform: translateX(14px); background: var(--pink); }
</style>
</head>
<body>

<header>
  <div class="logo">fi<span>n</span>om</div>
  <div class="badge">Facilitator Wheel</div>
</header>

<main>
  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheel" width="460" height="460"></canvas>
  </div>

  <div class="controls">
    <button class="spin-btn" id="spinBtn" onclick="spin()">Spin the wheel</button>
    <button class="edit-btn" onclick="openDrawer()">
      Edit team
      <span class="count-badge" id="countBadge">0</span>
    </button>
  </div>

  <div class="history-row" id="historyRow" style="display:none">
    <span>Last picks:</span>
    <span id="historyInline"></span>
  </div>
</main>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title">Team members</span>
    <button class="drawer-close" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-tabs">
    <div class="tab active" id="tab-btn-list" onclick="switchTab('list')">List</div>
    <div class="tab" id="tab-btn-bulk" onclick="switchTab('bulk')">Bulk paste</div>
  </div>

  <div class="tab-content active" id="tab-list">
    <div class="list-actions">
      <span class="member-count" id="memberCount">0 members</span>
      <button class="add-one-btn" onclick="addMember()">+ Add person</button>
    </div>
    <div class="members-scroll">
      <div class="members-list" id="membersList"></div>
    </div>
  </div>

  <div class="tab-content" id="tab-bulk">
    <div class="bulk-area">
      <p class="bulk-hint">Paste a list of names — <strong>one per line</strong>. Choose whether to replace or extend the current list.</p>
      <textarea id="bulkInput" placeholder="Alex K.&#10;Maria S.&#10;Denis P.&#10;Olga V.&#10;..." oninput="updateBulkPreview()"></textarea>
      <div class="bulk-mode-row">
        <button class="mode-btn active" id="modeReplace" onclick="setBulkMode('replace')">Replace list</button>
        <button class="mode-btn" id="modeAdd" onclick="setBulkMode('add')">Add to list</button>
      </div>
      <div class="bulk-footer">
        <span class="bulk-preview" id="bulkPreview">Paste names above</span>
        <button class="apply-btn" id="applyBulk" onclick="applyBulk()" disabled>Apply</button>
      </div>
    </div>
  </div>
</div>

<!-- RIG BAR -->
<div class="rig-bar">
  <label class="rig-label" id="rigLabel" for="rigCheck">
    <input type="checkbox" id="rigCheck" onchange="toggleRig(this)">
    Pre-selected facilitator mode
  </label>
  <span class="rig-note" id="rigNote">off</span>
</div>

<!-- WINNER -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-card">
    <div class="winner-label">Next facilitator</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="winner-sub">Good luck! 🎉</div>
    <button class="winner-close" onclick="closeWinner()">Got it</button>
  </div>
</div>

<script>
const SEG_COLORS = ['#FE42B4','#2e2e2e','#4A74FF','#383838','#d4389e','#1e1e1e','#3a5fcc','#444444'];
let members = ['Alex K.','Maria S.','Denis P.','Olga V.','Ivan N.','Yulia T.','Artem B.','Natasha R.'];
let spinning = false, currentAngle = 0, history = [], bulkMode = 'replace';
const canvas = document.getElementById('wheel'), ctx = canvas.getContext('2d');

function getNames() { return members.filter(m => m.trim() !== ''); }

function drawWheel(hi = -1) {
  const names = getNames();
  if (names.length < 2) return;
  const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 4;
  const arc = (2 * Math.PI) / names.length;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  names.forEach((name, i) => {
    const s = currentAngle + i * arc, e = s + arc;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, s, e); ctx.closePath();
    ctx.fillStyle = i === hi ? '#FE42B4' : SEG_COLORS[i % SEG_COLORS.length];
    ctx.fill(); ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(s + arc / 2);
    const display = name.length > 16 ? name.slice(0, 15) + '…' : name;
    const fs = names.length > 12 ? 10 : names.length > 8 ? 11 : 13;
    ctx.font = `500 ${fs}px 'Poppins', sans-serif`;
    ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(display, r - 16, 0); ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
  ctx.fillStyle = '#1a1a1a'; ctx.fill(); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = "500 11px 'Poppins', sans-serif"; ctx.fillStyle = '#888';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('spin', cx, cy);
}

const RIG_INDEX = 4;
let rigged = false;

function toggleRig(cb) {
  rigged = cb.checked;
  const label = document.getElementById('rigLabel');
  const note = document.getElementById('rigNote');
  label.classList.toggle('on', rigged);
  note.textContent = rigged ? `always picks #${RIG_INDEX + 1} in the list` : 'off';
}

function spin() {
  if (spinning) return;
  const names = getNames();
  if (names.length < 2) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const TAU = 2 * Math.PI;
  const arc = TAU / names.length;
  const a0 = currentAngle;
  let total;

  if (rigged && names.length > RIG_INDEX) {
    const targetIdx = RIG_INDEX;
    const segCenter = targetIdx * arc + arc / 2;
    const jitter = (Math.random() - 0.5) * arc * 0.55;
    const targetNorm = segCenter + jitter;
    const needed = ((-Math.PI / 2 - a0 - targetNorm) % TAU + TAU) % TAU;
    const extraSpins = (7 + Math.floor(Math.random() * 5)) * TAU;
    total = extraSpins + needed;
  } else {
    total = (5 + Math.floor(Math.random() * 5)) * TAU + Math.random() * TAU;
  }

  const dur = 4200 + Math.random() * 1200, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);

  function frame(now) {
    const p = Math.min((now - t0) / dur, 1);
    currentAngle = a0 + total * ease(p); drawWheel();
    if (p < 1) { requestAnimationFrame(frame); return; }
    currentAngle = a0 + total;
    const norm = (((-Math.PI / 2 - currentAngle) % TAU + TAU) % TAU);
    const wi = Math.floor(norm / arc) % names.length;
    drawWheel(wi); spinning = false;
    document.getElementById('spinBtn').disabled = false;
    setTimeout(() => showWinner(names[wi]), 300);
  }
  requestAnimationFrame(frame);
}

function showWinner(name) {
  document.getElementById('winnerName').textContent = name;
  document.getElementById('winnerOverlay').classList.add('active');
  history.unshift(name); if (history.length > 5) history = history.slice(0, 5);
  renderHistory();
}
function closeWinner() { document.getElementById('winnerOverlay').classList.remove('active'); }

function renderHistory() {
  const row = document.getElementById('historyRow'), el = document.getElementById('historyInline');
  if (!history.length) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  el.innerHTML = history.map((n, i) =>
    `<span class="hname">${n}</span>${i < history.length - 1 ? '<span class="sep"> · </span>' : ''}`
  ).join('');
}

function renderMembersList() {
  const list = document.getElementById('membersList');
  list.innerHTML = '';
  members.forEach((m, i) => {
    const row = document.createElement('div'); row.className = 'member-row';
    const inp = document.createElement('input'); inp.type = 'text'; inp.value = m; inp.placeholder = 'Name';
    inp.addEventListener('input', () => { members[i] = inp.value; drawWheel(); updateCount(); });
    const btn = document.createElement('button'); btn.className = 'remove-btn'; btn.textContent = '×';
    btn.onclick = () => { members.splice(i, 1); renderMembersList(); drawWheel(); };
    row.appendChild(inp); row.appendChild(btn); list.appendChild(row);
  });
  updateCount();
}

function updateCount() {
  const n = getNames().length;
  document.getElementById('countBadge').textContent = n;
  document.getElementById('memberCount').textContent = n + ' member' + (n !== 1 ? 's' : '');
}

function addMember() {
  members.push(''); renderMembersList();
  const ins = document.querySelectorAll('.member-row input');
  ins[ins.length - 1].focus();
}

function openDrawer() {
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  renderMembersList();
}
function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  drawWheel();
}

function switchTab(name) {
  ['list','bulk'].forEach(t => {
    document.getElementById('tab-btn-' + t).classList.toggle('active', t === name);
    document.getElementById('tab-' + t).classList.toggle('active', t === name);
  });
}

function setBulkMode(mode) {
  bulkMode = mode;
  document.getElementById('modeReplace').classList.toggle('active', mode === 'replace');
  document.getElementById('modeAdd').classList.toggle('active', mode === 'add');
  updateBulkPreview();
}

function parseBulk() {
  return document.getElementById('bulkInput').value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
}

function updateBulkPreview() {
  const names = parseBulk(), el = document.getElementById('bulkPreview'), btn = document.getElementById('applyBulk');
  if (!names.length) { el.innerHTML = 'Paste names above'; btn.disabled = true; return; }
  const cur = getNames().length;
  el.innerHTML = bulkMode === 'replace'
    ? `<b>${names.length}</b> people — replaces current list`
    : `<b>+${names.length}</b> people → <b>${cur + names.length}</b> total`;
  btn.disabled = false;
}

function applyBulk() {
  const names = parseBulk(); if (!names.length) return;
  members = bulkMode === 'replace' ? names : [...getNames(), ...names];
  document.getElementById('bulkInput').value = '';
  updateBulkPreview();
  switchTab('list'); renderMembersList(); drawWheel();
}

document.getElementById('winnerOverlay').addEventListener('click', function(e) { if (e.target === this) closeWinner(); });

renderMembersList(); drawWheel();
</script>
</body>
</html>
